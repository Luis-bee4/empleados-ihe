# Nombre de la aplicación.
spring.application.name=empleados

# Puerto del backend.
server.port=8080

# Conexión a PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/ihe_empleados
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# Crear y actualizar las tablas según las entidades Java.
# Esta opción se utilizará durante la práctica.
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL para estudiar su funcionamiento.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evitar mantener la sesión de base de datos durante la respuesta HTTP.
spring.jpa.open-in-view=false

# No exponer detalles técnicos en las respuestas HTTP.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
